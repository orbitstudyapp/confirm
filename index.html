<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email confirmed · Orbit</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #FBFBFE; color: #1A1A2E; padding: 24px;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 440px; background: #fff; border-radius: 18px;
    padding: 40px 28px; text-align: center;
    box-shadow: 0 6px 28px rgba(43,37,69,.10);
  }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 50%;
    background: linear-gradient(135deg,#6C5CE7,#4B3FBF);
    display: grid; place-items: center;
  }
  .mark svg { width: 30px; height: 30px; }
  h1 { font-size: 24px; line-height: 1.25; letter-spacing: -.5px; margin: 0 0 10px; }
  p  { margin: 0 0 14px; color: #56566C; }
  .hint { font-size: 14px; color: #747490; margin-top: 22px; }
  a { color: #5B4FC7; }
  .err .mark { background: linear-gradient(135deg,#C2453D,#8A2F2A); }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12.5l5.5 5.5L20 7"/>
      </svg>
    </div>
    <h1 id="title">You're confirmed</h1>
    <p id="body">Your email is verified. Open Orbit and sign in — you're all set.</p>
    <p class="hint">You can close this tab.</p>
  </main>

<script>
  (function () {
    var h = new URLSearchParams(location.hash.slice(1));
    var q = new URLSearchParams(location.search);
    var err = h.get('error') || q.get('error');
    if (!err) return;
    var code = h.get('error_code') || q.get('error_code') || '';
    var expired = /expired/i.test(code) || /expired/i.test(h.get('error_description') || '');
    document.getElementById('card').className = 'card err';
    document.querySelector('.mark svg').innerHTML =
      '<path d="M12 7v7"/><path d="M12 17.5v.5"/>';
    document.getElementById('title').textContent =
      expired ? 'That link has expired' : "That link didn't work";
    document.getElementById('body').innerHTML =
      expired
        ? 'Confirmation links are only good for 24 hours. Open Orbit, try to sign in, and tap <strong>Resend</strong> to get a fresh one.'
        : 'It may have already been used. Try signing in on Orbit — if it still fails, email <a href="mailto:orbitstudyapp@gmail.com">orbitstudyapp@gmail.com</a> and I\'ll sort it out.';
  })();
</script>
</body>
</html>
